; CONDA gateway — ESP32 DevKit V1 (ESP32-WROOM-32), framework Arduino.
; Versi platform dipaku agar API ESP-NOW (callback) tidak berubah diam-diam.
[platformio]
default_envs = gateway

[env:gateway]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -I../common
    -DCORE_DEBUG_LEVEL=0
    -DCONDA_CHANNEL=1

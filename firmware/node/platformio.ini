; CONDA node — ESP32 DevKit V1 (ESP32-WROOM-32), framework Arduino + NimBLE-Arduino.
; Satu env per node (ID berbeda). Pilih saat upload:  pio run -e node2 -t upload
; Versi platform & library dipaku agar API (ESP-NOW, NimBLE) tidak berubah diam-diam.
[platformio]
default_envs = node1

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; Wi-Fi + BLE + Arduino memakai >1,2 MB; skema partisi besar menghindari "text section exceeds"
board_build.partitions = huge_app.csv
build_flags =
    -I../common
    -DCORE_DEBUG_LEVEL=0
    -DCONDA_CHANNEL=1
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
lib_deps =
    h2zero/NimBLE-Arduino@1.4.3
    ; OLED SSD1306 128x64 (opsional; bila layar tak terpasang node tetap berjalan normal)
    adafruit/Adafruit SSD1306@2.5.9
    adafruit/Adafruit GFX Library@1.11.9

[env:node1]
build_flags = ${env.build_flags} -DCONDA_NODE_ID=1

; Mode USB-langsung: satu papan yang dicolok ke laptop berperan sebagai node + jembatan serial ke server
; (untuk uji/demo tanpa gateway). Jalankan:  python -m server --serial
[env:node1usb]
build_flags = ${env.build_flags} -DCONDA_NODE_ID=1 -DCONDA_USB_DIRECT=1

[env:node2]
build_flags = ${env.build_flags} -DCONDA_NODE_ID=2

[env:node3]
build_flags = ${env.build_flags} -DCONDA_NODE_ID=3
